<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <base target="_top">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .form-card {
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 500px;
    }
    .form-card h2 {
      text-align: center;
      color: #ff6600; /* لون مناسب للعلامات التجارية التقنية */
      margin-bottom: 20px;
      margin-top: 0;
    }
    .input-group {
      margin-bottom: 15px;
    }
    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }
    .input-group input, .input-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 14px;
    }
    .input-group input:focus, .input-group textarea:focus {
      border-color: #ff6600;
      outline: none;
    }
    .file-instructions {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
      display: block;
    }
    .notice-box {
      background-color: #fff3cd;
      color: #856404;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #ffeeba;
      margin-bottom: 20px;
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #ff6600;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #e65c00;
    }
    #success-message {
      display: none;
      text-align: center;
      color: #28a745;
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
      padding: 20px;
      border: 1px solid #c3e6cb;
      background-color: #d4edda;
      border-radius: 6px;
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <div class="form-card">
    <h2>طلب دعم فني</h2>
    
    <form>
      <div id="buttonDiv" style="text-align: center; margin-bottom: 20px;"></div>
      <div class="input-group">
        <label>اسم صاحب الطلب:</label>
        <input type="text" name="requesterName" required>
      </div>

      <div class="input-group">
        <label>اسم الشركة:</label>
        <input type="text" name="companyName" required>
      </div>

      <div class="input-group">
        <label>رقم الهاتف المحمول (واتساب):</label>
        <input type="tel" name="whatsapp" placeholder="للتواصل مع الدعم الفني" required>
      </div>

      <div class="input-group">
        <label>Serial Number (الرقم المسلسل للجهاز):</label>
        <input type="text" name="serialNumber" required>
      </div>

      <div class="input-group">
        <label>UUID (الرقم التعريفي للجهاز):</label>
        <input type="text" name="uuid" required>
      </div>

      <div class="input-group">
        <label>Email للتواصل:</label>
        <input type="email" name="email" required>
      </div>

      <div class="input-group">
        <label>Model (موديل الجهاز):</label>
        <input type="text" name="deviceModel" required>
      </div>

      <div class="input-group">
        <label>وصف المشكلة:</label>
        <textarea name="problem" rows="3" required></textarea>
      </div>

      <!-- حقول رفع الصور -->
      <div class="input-group">
        <label>صورة الملصق الموجود علي الكاميرا وبه السيريال:</label>
        <input type="file" name="cameraSticker" accept="image/*" required>
        <span class="file-instructions">* يرجى التأكد من أن الصورة واضحة ومطابقة للملصق الأصلي.</span>
      </div>

      <div class="input-group">
        <label>صورة الملصق الموجود على الكرتونة وبه السيريال:</label>
        <input type="file" name="boxSticker" accept="image/*" required>
        <span class="file-instructions">* يرجى التأكد من أن الصورة واضحة ومطابقة للملصق الأصلي.</span>
      </div>

      <div class="notice-box">
        سيتم الرد خلال <strong>(٤٨ ساعة عمل)</strong><br>
        إلى عنوان البريد الإلكتروني المسجل في الطلب أعلاه.
      </div>

      <button type="submit" id="submitBtn">إرسال الطلب</button>
    </form>
    
    <div id="success-message"></div>
  </div>

<script>
  // ⚠️ ضع رابط جوجل اسكربت الخاص بك هنا (الذي ينتهي بـ /exec)
  const scriptURL = 'https://script.google.com/macros/s/AKfycbwhUrOiwOpDzlnS5RxJXrs3YN3GCna4TaNF_4gREqpopiq2RUUIVMnkMb3K5GMdT85M/exec'; 

  const form = document.querySelector('form');
  const submitBtn = document.querySelector('button[type="submit"]');
  
  // استدعاء حقول الاسم والإيميل (تأكد أن الخاصية name مطابقة لأسماء الحقول في الـ HTML لديك)
  const nameInput = document.querySelector('input[name="requesterName"]');
  const emailInput = document.querySelector('input[name="email"]');

  // تعطيل زر الإرسال مبدئياً حتى يقوم العميل بتسجيل الدخول
  submitBtn.disabled = true;
  submitBtn.innerText = 'يرجى تسجيل الدخول بجوجل أولاً';

  // دالة التعامل مع استجابة جوجل بعد تسجيل الدخول
  function handleCredentialResponse(response) {
    // فك تشفير البيانات المرجعة من جوجل (JWT)
    const data = JSON.parse(atob(response.credential.split('.')[1]));

    // تعبئة الحقول تلقائياً
    if(nameInput) nameInput.value = data.name;
    if(emailInput) emailInput.value = data.email;

    // قفل الحقول (للقراءة فقط) وتغيير لون الخلفية لتمييزها
    if(nameInput) { nameInput.readOnly = true; nameInput.style.backgroundColor = "#e9ecef"; }
    if(emailInput) { emailInput.readOnly = true; emailInput.style.backgroundColor = "#e9ecef"; }

    // إخفاء زر جوجل وتفعيل زر الإرسال الخاص بك
    document.getElementById("buttonDiv").style.display = "none";
    submitBtn.disabled = false;
    submitBtn.innerText = 'إرسال الطلب';
  }

  // تهيئة زر تسجيل الدخول عند تحميل الصفحة
  window.onload = function () {
    google.accounts.id.initialize({
      client_id: '834579405034-gh14aesmusovvjgqsf74dk8nrvnu5hb8.apps.googleusercontent.com',
      callback: handleCredentialResponse
    });
    google.accounts.id.renderButton(
      document.getElementById("buttonDiv"),
      { theme: "outline", size: "large", locale: "ar", text: "continue_with" }
    );
  };

  // كود الإرسال إلى جوجل شيت
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.innerText = 'جاري رفع الصور وإرسال الطلب... يرجى الانتظار';

    const formData = new FormData(form);
    const data = Object.fromEntries(formData.entries());

    const getBase64 = (file) => new Promise((resolve, reject) => {
      if (!file || file.size === 0) return resolve("");
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });

    try {
      const cameraFileInput = document.querySelector('input[name="cameraSticker"]');
      const boxFileInput = document.querySelector('input[name="boxSticker"]');
      
      const cameraFile = cameraFileInput ? cameraFileInput.files[0] : null;
      const boxFile = boxFileInput ? boxFileInput.files[0] : null;

      data.cameraSticker = await getBase64(cameraFile);
      data.boxSticker = await getBase64(boxFile);

      const response = await fetch(scriptURL, {
        method: 'POST',
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(data),
      });

      if(response.ok) {
        alert('تم استلام طلبك بنجاح. سيتم الرد خلال (٤٨ ساعة عمل).');
        form.reset();
        submitBtn.innerText = 'تم الإرسال';
      } else {
        alert('حدث خطأ أثناء الإرسال، يرجى المحاولة لاحقاً.');
      }
    } catch (error) {
      alert('تعذر الاتصال بالخادم: ' + error.message);
    } finally {
      if(submitBtn.innerText !== 'تم الإرسال') {
        submitBtn.disabled = false;
        submitBtn.innerText = 'إرسال الطلب';
      }
    }
  });
</script>
</body>
</html>
