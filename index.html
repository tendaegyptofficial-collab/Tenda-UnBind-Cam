<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <base target="_top">
  
  <!-- استدعاء مكتبة SweetAlert2 للرسائل الاحترافية -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- استدعاء مكتبة تسجيل الدخول بجوجل -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('BG.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }

    .form-card {
      background: rgba(255, 255, 255, 0.90); /* تعديل الشفافية ليكون النص أوضح */
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 500px;
    }

    .form-card h2 {
      text-align: center;
      color: #ff6600;
      margin-bottom: 20px;
      margin-top: 0;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    .input-group input, .input-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 14px;
    }

    .input-group input:focus, .input-group textarea:focus {
      border-color: #ff6600;
      outline: none;
    }

    .file-instructions {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
      display: block;
    }

    .notice-box {
      background-color: #fff3cd;
      color: #856404;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #ffeeba;
      margin-bottom: 20px;
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #ff6600;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #e65c00;
    }

    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    /* تصميم دائرة التحميل */
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      vertical-align: middle;
      margin-left: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- إعدادات جوجل للتحقق والتسجيل (مخفية وتعمل بالخلفية) -->
  <div id="g_id_onload"
       data-client_id="659091735778-gk4ttihm2vs1p2psg6s4n92ekela9tc1.apps.googleusercontent.com"
       data-context="signin"
       data-ux_mode="popup"
       data-callback="handleCredentialResponse"
       data-itp_support="true"
       data-auto_prompt="false">
  </div>

  <div class="form-card">
    <h2>طلب الغاء حساب كاميرا</h2>
    
    <form>
      <!-- زر جوجل المرئي للعميل -->
      <div id="buttonDiv" style="text-align: center; margin-bottom: 30px;"></div>
      
      <div class="input-group">
        <label>اسم صاحب الطلب:</label>
        <input type="text" name="requesterName" required>
      </div>

      <div class="input-group">
        <label>اسم الشركة:</label>
        <input type="text" name="companyName" required>
      </div>

      <div class="input-group">
        <label>رقم الهاتف المحمول (واتساب):</label>
        <input type="tel" name="whatsapp" placeholder="مثال: 01012345678" required maxlength="11" pattern="[0-9]{11}" title="يرجى إدخال 11 رقماً فقط" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
      </div>

      <div class="input-group">
        <label>Serial Number (الرقم المسلسل للجهاز):</label>
        <input type="text" name="serialNumber" required minlength="17" maxlength="20" pattern="[a-zA-Z0-9]{10,20}" title="يرجى إدخال من 10 إلى 20 حرفاً أو رقماً" oninput="this.value = this.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase()">
      </div>

      <div class="input-group">
        <label>UUID (الرقم التعريفي للجهاز):</label>
        <input type="text" name="uuid" required minlength="10" maxlength="10" pattern="[a-zA-Z0-9]{10}" title="يرجى إدخال 10 حرفاً أو رقماً بالضبط" oninput="this.value = this.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase()">
      </div>

      <div class="input-group">
        <label>Email للتواصل:</label>
        <input type="email" name="email" required>
      </div>

      <div class="input-group">
        <label>Model (موديل الجهاز):</label>
        <input type="text" name="model" required pattern="[a-zA-Z0-9\s\-]+" title="يرجى إدخال حروف إنجليزية وأرقام فقط" oninput="this.value = this.value.replace(/[^a-zA-Z0-9\s\-]/g, '').toUpperCase()">
      </div>

      <div class="input-group">
        <label>وصف المشكلة:</label>
        <textarea name="problem" rows="3" required></textarea>
      </div>

      <div class="input-group">
        <label>صورة الملصق الموجود علي الكاميرا وبه السيريال:</label>
        <input type="file" name="cameraSticker" accept="image/*" required>
        <span class="file-instructions">* يرجى التأكد من أن الصورة واضحة ومطابقة للملصق الأصلي.</span>
      </div>

      <div class="input-group">
        <label>صورة الملصق الموجود على الكرتونة وبه السيريال:</label>
        <input type="file" name="boxSticker" accept="image/*" required>
        <span class="file-instructions">* يرجى التأكد من أن الصورة واضحة ومطابقة للملصق الأصلي.</span>
      </div>

      <div class="notice-box">
        سيتم الرد خلال <strong>(٤٨ ساعة عمل)</strong><br>
        إلى عنوان البريد الإلكتروني المسجل في الطلب أعلاه.
      </div>

      <button type="submit" id="submitBtn">إرسال الطلب</button>
    </form>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwhUrOiwOpDzlnS5RxJXrs3YN3GCna4TaNF_4gREqpopiq2RUUIVMnkMb3K5GMdT85M/exec'; 

    const form = document.querySelector('form');
    const submitBtn = document.querySelector('button[type="submit"]');
    
    const nameInput = document.querySelector('input[name="requesterName"]');
    const emailInput = document.querySelector('input[name="email"]');

    // تعطيل زر الإرسال مبدئياً حتى يقوم العميل بتسجيل الدخول
    submitBtn.disabled = true;
    submitBtn.innerText = 'يرجى تسجيل الدخول بجوجل أولاً';

    // دالة التعامل مع استجابة جوجل بعد تسجيل الدخول
    function handleCredentialResponse(response) {
      const base64Url = response.credential.split('.')[1];
const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
  return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
}).join(''));
const data = JSON.parse(jsonPayload);

      if(nameInput) nameInput.value = data.name;
      if(emailInput) emailInput.value = data.email;

      if(nameInput) { nameInput.readOnly = true; nameInput.style.backgroundColor = "#e9ecef"; }
      if(emailInput) { emailInput.readOnly = true; emailInput.style.backgroundColor = "#e9ecef"; }

      document.getElementById("buttonDiv").style.display = "none";
      submitBtn.disabled = false;
      submitBtn.innerText = 'إرسال الطلب';
    }

    // تهيئة زر تسجيل الدخول عند تحميل الصفحة
    window.onload = function () {
      google.accounts.id.renderButton(
        document.getElementById("buttonDiv"),
        { theme: "outline", size: "large", locale: "ar", text: "continue_with" }
      );
    };

    // كود الإرسال وضغط الصور
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> جاري المعالجة والرفع...';

      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      // دالة ضغط الصور
      const getBase64 = (file) => new Promise((resolve, reject) => {
        if (!file || file.size === 0) return resolve("");
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const MAX_WIDTH = 800; 
            const MAX_HEIGHT = 800; 
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            } else {
              if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.6);
            resolve(dataUrl);
          };
          img.onerror = error => reject(error);
        };
        reader.onerror = error => reject(error);
      });

      try {
        const cameraFileInput = document.querySelector('input[name="cameraSticker"]');
        const boxFileInput = document.querySelector('input[name="boxSticker"]');
        
        data.cameraSticker = await getBase64(cameraFileInput ? cameraFileInput.files[0] : null);
        data.boxSticker = await getBase64(boxFileInput ? boxFileInput.files[0] : null);

        const response = await fetch(scriptURL, {
          method: 'POST',
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(data),
        });

        const result = await response.json(); 

        if(result.status === "blocked_daily") {
          Swal.fire({
            icon: 'warning',
            title: 'تجاوزت الحد المسموح',
            text: 'عفواً، لقد استنفدت الحد الأقصى للطلبات (3 طلبات) لهذا اليوم. يرجى المحاولة مرة أخرى غداً.',
            confirmButtonColor: '#ff6600',
            confirmButtonText: 'حسناً'
          });
        } else if (result.status === "success") {
          Swal.fire({
            icon: 'success',
            title: 'تم الإرسال بنجاح',
            text: 'تم استلام طلبك بنجاح. سيتم الرد خلال (٤٨ ساعة عمل).',
            confirmButtonColor: '#ff6600',
            confirmButtonText: 'موافق'
          });
          form.reset();
          submitBtn.innerHTML = 'تم الإرسال';
        } else {
          Swal.fire({
            icon: 'error',
            title: 'عفواً',
            text: 'حدث خطأ غير متوقع، يرجى المحاولة لاحقاً.',
            confirmButtonColor: '#ff6600',
            confirmButtonText: 'إغلاق'
          });
        }
      } catch (error) {
        Swal.fire({
          icon: 'error',
          title: 'خطأ في الاتصال',
          text: 'تعذر الاتصال بالخادم، تحقق من اتصالك بالإنترنت.',
          confirmButtonColor: '#ff6600',
          confirmButtonText: 'إغلاق'
        });
      } finally {
        if(submitBtn.innerHTML !== 'تم الإرسال') {
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'إرسال الطلب';
        }
      }
    });
  </script>
</body>
</html>
