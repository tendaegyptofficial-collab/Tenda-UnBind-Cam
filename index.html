<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <base target="_top">
  
  <!-- استدعاء مكتبة SweetAlert2 للرسائل الاحترافية -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- استدعاء مكتبة تسجيل الدخول بجوجل -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('BG.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }

    .form-card {
      background: rgba(255, 255, 255, 0.50);
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 500px;
    }

    .form-card h2 {
      text-align: center;
      color: #333333;
      font-size: 30px;
      margin-bottom: 20px;
      margin-top: 0;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    .input-group input, .input-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 14px;
    }

    .input-group input:focus, .input-group textarea:focus {
      border-color: #ff6600;
      outline: none;
    }

    .file-instructions {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
      display: block;
    }

    .notice-box {
      background-color: #fff3cd;
      color: #856404;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #ffeeba;
      margin-bottom: 20px;
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #ff6600;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #e65c00;
    }

    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      vertical-align: middle;
      margin-left: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="g_id_onload"
       data-client_id="659091735778-gk4ttihm2vs1p2psg6s4n92ekela9tc1.apps.googleusercontent.com"
       data-context="signin"
       data-ux_mode="popup"
       data-callback="handleCredentialResponse"
       data-itp_support="true"
       data-auto_prompt="false">
  </div>

  <div class="form-card">
    <h2> طلب الغاء حساب(UnBind) </h2>
    
    <!-- النموذج يوجه البيانات إلى الرابط وداخل الـ iframe المخفي -->
    <form id="myForm" method="POST" target="hidden_iframe">
      
      <div style="display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap;">
        <div id="buttonDiv"></div>
        <div>
          <a href="https://wa.me/+201025399888" target="_blank" style="display: inline-flex; align-items: center; justify-content: center; background-color: #25D366; color: white; padding: 0 20px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; height: 44px; box-sizing: border-box; box-shadow: 0 2px 5px rgba(0,0,0,0.1); white-space: nowrap;">
            💬 واتساب الدعم
          </a>
        </div>
      </div>
      
      <div class="input-group">
        <label>اسم صاحب الطلب:</label>
        <input type="text" name="requesterName" required>
      </div>

      <div class="input-group">
        <label>اسم الشركة:</label>
        <input type="text" name="companyName" required>
      </div>

      <div class="input-group">
        <label>رقم الهاتف المحمول (واتساب):</label>
        <input type="tel" name="whatsapp" placeholder="مثال: 01012345678" required maxlength="11" pattern="[0-9]{11}" title="يرجى إدخال 11 رقماً فقط" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
      </div>

      <div class="input-group">
        <label>Serial Number (الرقم المسلسل للجهاز):</label>
        <input type="text" name="serialNumber" required minlength="17" maxlength="20" pattern="[a-zA-Z0-9]{10,20}" title="يرجى إدخال من 10 إلى 20 حرفاً أو رقماً" oninput="this.value = this.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase()">
      </div>

      <div class="input-group">
        <label>UUID (الرقم التعريفي للجهاز):</label>
        <input type="text" name="uuid" required minlength="10" maxlength="10" pattern="[a-zA-Z0-9]{10}" title="يرجى إدخال 10 حرفاً أو رقماً بالضبط" oninput="this.value = this.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase()">
      </div>

      <div class="input-group">
        <label>Email للتواصل:</label>
        <input type="email" name="email" required>
      </div>

      <div class="input-group">
        <label>Model (موديل الجهاز):</label>
        <input type="text" name="model" required pattern="[a-zA-Z0-9\s\-]+" title="يرجى إدخال حروف إنجليزية وأرقام فقط" oninput="this.value = this.value.replace(/[^a-zA-Z0-9\s\-]/g, '').toUpperCase()">
      </div>

      <div class="input-group">
        <label>وصف المشكلة:</label>
        <textarea name="problem" rows="3" required></textarea>
      </div>

      <div class="input-group">
        <label>صورة الملصق الموجود علي الكاميرا وبه السيريال:</label>
        <input type="file" name="cameraSticker" accept="image/*" required>
        <span class="file-instructions">* يرجى التأكد من أن الصورة واضحة ومطابقة للملصق الأصلي.</span>
      </div>

      <div class="input-group">
        <label>صورة الملصق الموجود على الكرتونة وبه السيريال:</label>
        <input type="file" name="boxSticker" accept="image/*" required>
        <span class="file-instructions">* يرجى التأكد من أن الصورة واضحة ومطابقة للملصق الأصلي.</span>
      </div>

      <!-- حقول مخفية لمرور الصور المحولة إلى Base64 -->
      <input type="hidden" name="cameraStickerBase64" id="cameraStickerBase64">
      <input type="hidden" name="boxStickerBase64" id="boxStickerBase64">

      <div class="notice-box">
        سيتم الرد خلال <strong>(٤٨ ساعة عمل)</strong><br>
        إلى عنوان البريد الإلكتروني المسجل في الطلب أعلاه.
      </div>

      <button type="submit" id="submitBtn">إرسال الطلب</button>
    </form>
  </div>

  <!-- إطار مخفي لاستقبال رد الإرسال وضمان عدم حدوث CORS -->
  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(isSubmitted) { successAction(); }"></iframe>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzzt6YkLqiemXDN2KRle3k4Mt-AsyddKkASqj8eEUTIZGWwToY1vZl9e9NqVPweAIL3EA/exec'; 
    const form = document.getElementById('myForm');
    const submitBtn = document.getElementById('submitBtn');
    
    const nameInput = document.querySelector('input[name="requesterName"]');
    const emailInput = document.querySelector('input[name="email"]');

    let isSubmitted = false;

    submitBtn.disabled = true;
    submitBtn.innerText = 'يرجى تسجيل الدخول بجوجل أولاً';

    function handleCredentialResponse(response) {
      const base64Url = response.credential.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      const data = JSON.parse(jsonPayload);

      if(nameInput) nameInput.value = data.name;
      if(emailInput) emailInput.value = data.email;

      if(nameInput) { nameInput.readOnly = true; nameInput.style.backgroundColor = "#e9ecef"; }
      if(emailInput) { emailInput.readOnly = true; emailInput.style.backgroundColor = "#e9ecef"; }

      document.getElementById("buttonDiv").style.display = "none";
      submitBtn.disabled = false;
      submitBtn.innerText = 'إرسال الطلب';
    }

    window.onload = function () {
      google.accounts.id.renderButton(
        document.getElementById("buttonDiv"),
        { theme: "outline", size: "large", locale: "ar", text: "continue_with" }
      );
    };

    // دالة ضغط الصور وإرسال النموذج
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> جاري المعالجة والرفع...';

      const getBase64 = (file) => new Promise((resolve, reject) => {
        if (!file || file.size === 0) return resolve("");
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const MAX_WIDTH = 800; 
            const MAX_HEIGHT = 800; 
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            } else {
              if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.6);
            resolve(dataUrl);
          };
          img.onerror = error => reject(error);
        };
        reader.onerror = error => reject(error);
      });

      try {
        const cameraFileInput = document.querySelector('input[name="cameraSticker"]');
        const boxFileInput = document.querySelector('input[name="boxSticker"]');
        
        document.getElementById('cameraStickerBase64').value = await getBase64(cameraFileInput ? cameraFileInput.files[0] : null);
        document.getElementById('boxStickerBase64').value = await getBase64(boxFileInput ? boxFileInput.files[0] : null);

        form.action = scriptURL;
        isSubmitted = true;
        form.submit(); // إرسال النموذج مباشرة عبر الإطار المخفي

      } catch (error) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'إرسال الطلب';
        Swal.fire({
          icon: 'error',
          title: 'خطأ',
          text: 'حدث خطأ أثناء معالجة الصور.',
          confirmButtonColor: '#ff6600'
        });
      }
    });

    function successAction() {
      Swal.fire({
        icon: 'success',
        title: 'تم الإرسال بنجاح',
        text: 'تم استلام طلبك بنجاح. سيتم الرد خلال (٤٨ ساعة عمل).',
        confirmButtonColor: '#ff6600',
        confirmButtonText: 'موافق'
      });
      form.reset();
      submitBtn.innerHTML = 'تم الإرسال';
      isSubmitted = false;
    }
  </script>
</body>
</html>
